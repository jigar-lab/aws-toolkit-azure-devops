version: 0.2
phases:
    install:
        commands:
            - |
                if(-Not($Env:CODE_COV_TOKEN -eq $null)) {
                    # Pin the Chocolatey `codecov` package to an explicit version and
                    # require checksum verification of the files it fetches. Previously
                    # this ran `choco install codecov` with no --version and no checksum
                    # requirement, so the build host installed whatever the Chocolatey
                    # feed served at build time (same unverified-third-party-code pattern
                    # as the Linux `curl | bash` path).
                    #
                    # `--require-checksums` makes Chocolatey abort if the downloaded
                    # binary does not match the SHA-256/SHA-512 recorded in the pinned
                    # package version's chocolateyInstall.ps1. If a newer uploader
                    # version is required, bump CODECOV_CHOCO_VERSION after verifying
                    # the new package's publisher and checksum metadata on the
                    # Chocolatey community site; do not revert to an unpinned install.
                    $ErrorActionPreference = 'Stop'
                    $CODECOV_CHOCO_VERSION = '1.14.0'
                    choco install codecov `
                      --yes --no-progress `
                      --version=$CODECOV_CHOCO_VERSION `
                      --require-checksums
                    if ($LASTEXITCODE -ne 0) { throw "choco install codecov failed" }
                }
    pre_build:
        commands:
            - node --version
            - npm --version

    build:
        commands:
            - npm ci
            - npm run fullBuild publisher=awscibuild
            - $env:TEST_REPORT_DIR="$env:CODEBUILD_SRC_DIR/.test_reports"; npm run test
            - |
                if(-Not($Env:CODEBUILD_BUILD_SUCCEEDING -eq "0" -Or $Env:CODE_COV_TOKEN -eq $null)) {
                  $env:VCS_COMMIT_ID=$Env:CODEBUILD_RESOLVED_SOURCE_VERSION;
                  $env:CI_BUILD_URL=[uri]::EscapeUriString($Env:CODEBUILD_BUILD_URL);
                  $env:CI_BUILD_ID=$Env:CODEBUILD_BUILD_ID;
                  codecov -t $Env:CODE_COV_TOKEN `
                    --flag unittest `
                    -f "build/reports/jacoco/coverageReport/coverageReport.xml" `
                    -c $Env:CODEBUILD_RESOLVED_SOURCE_VERSION
                }
reports:
    unit-test:
        files:
            - 'testReport.xml'
        base-directory: '$env:CODEBUILD_SRC_DIR/.test-reports'
        file-format: JUNITXML
